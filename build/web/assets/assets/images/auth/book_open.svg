<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" fill="none">
  <defs>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="pageLeft" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="60%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="pageRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>
  <!-- Cyan Aura -->
  <ellipse cx="80" cy="62" rx="48" ry="32" fill="#00D2FF" opacity="0.45" filter="url(#cyanGlow)"/>
  <!-- Blue Hardcover Base -->
  <path d="M 22 72 Q 50 84 80 88 Q 110 84 138 72 L 134 84 Q 108 96 80 100 Q 52 96 26 84 Z" fill="url(#coverGrad)" opacity="0.95"/>
  <!-- Left Page Stack -->
  <path d="M 80 86 Q 52 80 26 66 L 32 38 Q 56 52 80 58 Z" fill="url(#pageLeft)"/>
  <!-- Right Page Stack -->
  <path d="M 80 86 Q 108 80 134 66 L 128 38 Q 104 52 80 58 Z" fill="url(#pageRight)"/>
  <!-- Top Curved Flipping Page -->
  <path d="M 80 84 Q 58 66 44 34 L 50 30 Q 64 64 80 76 Z" fill="#FFFFFF" opacity="0.9"/>
  <!-- Central Spine -->
  <line x1="80" y1="58" x2="80" y2="86" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
</svg>
