<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100" fill="none">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="closedCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="60%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-18 60 50)" filter="url(#shadow)">
    <!-- Spine Thickness -->
    <path d="M 22 24 L 22 74 L 32 80 L 32 30 Z" fill="#1E3A8A"/>
    <!-- Page Block Thickness -->
    <path d="M 32 80 L 88 64 L 88 56 L 32 72 Z" fill="#E2E8F0"/>
    <!-- Front Hardcover -->
    <path d="M 30 28 L 88 12 L 92 62 L 34 78 Z" fill="url(#closedCoverGrad)"/>
    <!-- Ribbon Bookmark -->
    <path d="M 60 18 L 64 68 L 70 66 L 66 16 Z" fill="#F59E0B"/>
    <!-- Ribbon V-notch tail -->
    <polygon points="64,68 67,64 70,66 69,74 65,72" fill="#D97706"/>
    <!-- Cover Border Emboss -->
    <path d="M 35 32 L 83 18 L 86 58 L 38 72 Z" stroke="#60A5FA" stroke-width="1.2" opacity="0.6"/>
  </g>
</svg>
