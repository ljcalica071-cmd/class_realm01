<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 50" width="60" height="50" fill="none">
  <defs>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-15 30 25)" filter="url(#paperShadow)">
    <!-- Curled Fluttering Sheet -->
    <path d="M 10 10 Q 30 6 50 12 Q 46 28 48 40 Q 28 36 12 42 Q 14 26 10 10 Z" fill="url(#paperGrad)"/>
    <!-- Ruled Lines -->
    <line x1="16" y1="18" x2="42" y2="20" stroke="#CBD5E1" stroke-width="1" stroke-linecap="round"/>
    <line x1="16" y1="24" x2="40" y2="26" stroke="#CBD5E1" stroke-width="1" stroke-linecap="round"/>
    <line x1="17" y1="30" x2="38" y2="32" stroke="#CBD5E1" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
