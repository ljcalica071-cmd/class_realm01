<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <linearGradient id="leafGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1B4332"/>
      <stop offset="100%" stop-color="#40916C"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#52B788"/>
    </linearGradient>
    <linearGradient id="leafGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#40916C"/>
      <stop offset="100%" stop-color="#95D5B2"/>
    </linearGradient>
    <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="-2" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#leafShadow)">
    <!-- Botanical Leaf 1 -->
    <path d="M 0 200 Q 60 140 70 80 Q 20 110 0 200 Z" fill="url(#leafGrad1)"/>
    <!-- Botanical Leaf 2 -->
    <path d="M 0 200 Q 90 120 130 50 Q 70 90 0 200 Z" fill="url(#leafGrad2)"/>
    <!-- Botanical Leaf 3 -->
    <path d="M 0 200 Q 120 140 180 110 Q 110 130 0 200 Z" fill="url(#leafGrad1)"/>
    <!-- Botanical Leaf 4 -->
    <path d="M 0 200 Q 100 160 160 150 Q 90 170 0 200 Z" fill="url(#leafGrad3)"/>
    <!-- Botanical Leaf 5 -->
    <path d="M 0 200 Q 40 120 40 60 Q 10 100 0 200 Z" fill="url(#leafGrad2)"/>
  </g>
</svg>
