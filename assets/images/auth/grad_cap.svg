<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 120" width="140" height="120" fill="none">
  <defs>
    <filter id="capCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="capTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="skullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <!-- Cyan Aura -->
  <circle cx="70" cy="55" r="45" fill="#00D2FF" opacity="0.6" filter="url(#capCyanGlow)"/>
  <!-- Skull Cap (Lower hemisphere) -->
  <path d="M 40 60 Q 70 88 100 62 L 95 54 Q 70 76 45 52 Z" fill="url(#skullGrad)"/>
  <!-- Diamond Mortarboard Top -->
  <polygon points="15,48 70,22 125,50 70,74" fill="url(#capTopGrad)"/>
  <polygon points="15,48 70,22 125,50 70,74" stroke="#93C5FD" stroke-width="1.2" opacity="0.5"/>
  <!-- Center Golden Button -->
  <circle cx="70" cy="48" r="4.5" fill="#FBBF24"/>
  <!-- Golden Tassel Draping Down -->
  <path d="M 70 48 Q 100 50 112 68 Q 116 82 114 96" stroke="#F59E0B" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <!-- Tassel Fringe -->
  <polygon points="110,96 118,96 120,108 108,108" fill="#F59E0B"/>
  <circle cx="114" cy="96" r="3" fill="#D97706"/>
</svg>
